<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="60%" stop-color="#8B84FF"/>
      <stop offset="100%" stop-color="#5BC0EB"/>
    </linearGradient>
    <linearGradient id="clock-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F0FF"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#25243A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)"/>

  <!-- Subtle glow inner circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="4"/>

  <!-- Main Clock Body with Shadow -->
  <circle cx="256" cy="256" r="140" fill="url(#clock-grad)" filter="url(#shadow)"/>

  <!-- Clock Ring -->
  <circle cx="256" cy="256" r="128" fill="none" stroke="#6C63FF" stroke-width="8" stroke-dasharray="2 12" stroke-linecap="round"/>

  <!-- Clock Hour Ticks -->
  <circle cx="256" cy="136" r="6" fill="#6C63FF"/>
  <circle cx="376" cy="256" r="6" fill="#6C63FF"/>
  <circle cx="256" cy="376" r="6" fill="#6C63FF"/>
  <circle cx="136" cy="256" r="6" fill="#6C63FF"/>

  <!-- Clock Center Pin -->
  <circle cx="256" cy="256" r="14" fill="#6C63FF"/>

  <!-- Clock Hands (Time ~ 10:10) -->
  <!-- Hour hand -->
  <line x1="256" y1="256" x2="190" y2="180" stroke="#6C63FF" stroke-width="12" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="256" y1="256" x2="310" y2="150" stroke="#25243A" stroke-width="9" stroke-linecap="round"/>
  <!-- Second hand / accent spark -->
  <line x1="256" y1="256" x2="256" y2="330" stroke="#EF4444" stroke-width="4" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="6" fill="#FFFFFF"/>

  <!-- Sparkle / AI Star top right -->
  <path d="M 370 120 Q 385 120 385 105 Q 385 120 400 120 Q 385 120 385 135 Q 385 120 370 120 Z" fill="#6EE7B7"/>
  <path d="M 120 360 Q 130 360 130 350 Q 130 360 140 360 Q 130 360 130 370 Q 130 360 120 360 Z" fill="#F8A5C2"/>
</svg>
